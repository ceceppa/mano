<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1420" aria-labelledby="mano-title mano-description" viewBox="0 0 1080 1420"><title>Mano phase-driven learning loop</title><desc>A living backlog is updated through import, start, review, and direct human edits before feeding one approved small phase. Needed planning artifacts can be created, reused, or brought in from elsewhere. Auto mode is optional; when enabled, it starts after approval, runs the needed planning skills, pauses for human decisions, and stops after the build. The human uses and reviews the result, and learning updates the backlog. Post-hooks add specialist checks and project automation. Optional owner mode supports parallel phase tracks over a shared backlog.</desc><path fill="#faf5ee" d="M0 0h1080v1420H0Z" style="stroke-width:1.0256"/><rect width="456" height="348" x="72" y="626" fill="#e6f2ea" rx="30"/><text x="72" y="92" fill="#221f1d" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" font-weight="800" letter-spacing="4" style="font-style:normal;font-variant:normal;font-weight:700;font-stretch:normal;font-family:Inter;-inkscape-font-specification:&quot;Inter Bold&quot;">MANO</text><rect width="56" height="6" x="201" y="80" fill="#5b4fd4" rx="3"/><text x="72" y="124" fill="#6f6660" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="500" style="font-style:normal;font-variant:normal;font-weight:500;font-stretch:normal;font-family:Inter;-inkscape-font-specification:&quot;Inter Medium&quot;;fill:#47423e;fill-opacity:1">Phase-driven development for AI-assisted coding</text><text x="72" y="188" fill="#221f1d" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="50" font-weight="800" letter-spacing="-1.1" style="font-style:normal;font-variant:normal;font-weight:700;font-stretch:normal;font-family:Inter;-inkscape-font-specification:&quot;Inter Bold&quot;">Build less. <tspan fill="#156f45" style="font-style:normal;font-variant:normal;font-weight:700;font-stretch:normal;font-family:Inter;-inkscape-font-specification:&quot;Inter Bold&quot;">Learn sooner.</tspan></text><text x="72" y="248" fill="#221f1d" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="50" font-weight="800" letter-spacing="-1.1" style="font-style:normal;font-variant:normal;font-weight:700;font-stretch:normal;font-family:Inter;-inkscape-font-specification:&quot;Inter Bold&quot;">Change course.</text><text x="72" y="306" fill="#221f1d" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="25" font-weight="700" style="font-style:normal;font-variant:normal;font-weight:500;font-stretch:normal;font-family:Inter;-inkscape-font-specification:&quot;Inter Medium&quot;">You decide why, what, and how.</text><text x="72" y="340" fill="#6f6660" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" style="font-style:normal;font-variant:normal;font-weight:500;font-stretch:normal;font-family:Inter;-inkscape-font-specification:&quot;Inter Medium&quot;;fill:#47423e;fill-opacity:1">Mano helps plan and review one learning loop at a time.</text><rect width="400" height="200" x="72" y="396" fill="#f4f2fd" stroke="#221f1d" stroke-width="4" rx="26"/><text x="100" y="452" fill="#221f1d" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="800" letter-spacing=".3" style="font-style:normal;font-variant:normal;font-weight:700;font-stretch:normal;font-family:Inter;-inkscape-font-specification:&quot;Inter Bold&quot;">LIVING BACKLOG</text><text x="100" y="484" fill="#6f6660" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="500" style="font-style:normal;font-variant:normal;font-weight:500;font-stretch:normal;font-family:Inter;-inkscape-font-specification:&quot;Inter Medium&quot;;fill:#4c4641;fill-opacity:1"><tspan x="100" y="484">Updated through import • start •</tspan><tspan x="100" y="504">review • human edits</tspan></text><g transform="translate(0 20)"><rect width="300" height="38" x="100" y="512" fill="#e4e0f9" rx="19"/><text x="250" y="536.4" fill="#40359f" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" style="font-style:normal;font-variant:normal;font-weight:700;font-stretch:normal;font-family:Inter;-inkscape-font-specification:&quot;Inter Bold&quot;" text-anchor="middle">Human-readable • Human-editable</text></g><path stroke="#221f1d" stroke-width="9.182" d="M476 496h112.405" style="stroke-width:4.5;stroke-dasharray:none"/><path stroke="#221f1d" stroke-width="4.5" d="M587 496h5"/><path fill="#221f1d" d="m606 496-14-9v18z"/><rect width="400" height="136" x="608" y="428" fill="#fff" stroke="#221f1d" stroke-width="2.5" rx="24"/><text x="636" y="478" fill="#221f1d" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" font-weight="800" letter-spacing=".2" style="font-style:normal;font-variant:normal;font-weight:700;font-stretch:normal;font-family:Inter;-inkscape-font-specification:&quot;Inter Bold&quot;">APPROVE ONE</text><text x="636" y="509" fill="#221f1d" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" font-weight="800" letter-spacing=".2" style="font-style:normal;font-variant:normal;font-weight:700;font-stretch:normal;font-family:Inter;-inkscape-font-specification:&quot;Inter Bold&quot;">SMALL PHASE</text><text x="636" y="540" fill="#6f6660" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="500" style="font-style:normal;font-variant:normal;font-weight:500;font-stretch:normal;font-family:Inter;-inkscape-font-specification:&quot;Inter Medium&quot;;fill:#4c4641;fill-opacity:1">Only the next useful slice</text><path stroke="#221f1d" stroke-width="4.5" d="M808 564v22"/><path fill="#221f1d" d="m808 600-9-15h18z"/><rect width="400" height="192" x="608" y="604" fill="#fff" stroke="#221f1d" stroke-width="2.5" rx="24"/><text x="636" y="654" fill="#221f1d" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" font-weight="800" letter-spacing=".2" style="font-style:normal;font-variant:normal;font-weight:700;font-stretch:normal;font-family:Inter;-inkscape-font-specification:&quot;Inter Bold&quot;">ADD ONLY NEEDED</text><text x="636" y="685" fill="#221f1d" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" font-weight="800" letter-spacing=".2" style="font-style:normal;font-variant:normal;font-weight:700;font-stretch:normal;font-family:Inter;-inkscape-font-specification:&quot;Inter Bold&quot;">CONTEXT</text><rect width="68" height="38" x="636" y="702" fill="#ddeeec" stroke="#0f7f78" stroke-dasharray="6, 5" stroke-width="2" rx="19"/><text x="670" y="726.4" fill="#0f7f78" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" style="font-style:normal;font-variant:normal;font-weight:700;font-stretch:normal;font-family:Inter;-inkscape-font-specification:&quot;Inter Bold&quot;;fill:#0b514d;fill-opacity:1" text-anchor="middle">spec</text><rect width="50" height="38" x="716" y="702" fill="#ddeeec" stroke="#0f7f78" stroke-dasharray="6, 5" stroke-width="2" rx="19"/><text x="741" y="726.4" fill="#0f7f78" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" style="font-style:normal;font-variant:normal;font-weight:700;font-stretch:normal;font-family:Inter;-inkscape-font-specification:&quot;Inter Bold&quot;;fill:#0b514d;fill-opacity:1" text-anchor="middle">ux</text><rect width="69" height="38" x="778" y="702" fill="#ddeeec" stroke="#0f7f78" stroke-dasharray="6, 5" stroke-width="2" rx="19"/><text x="812.5" y="726.4" fill="#0f7f78" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" style="font-style:normal;font-variant:normal;font-weight:700;font-stretch:normal;font-family:Inter;-inkscape-font-specification:&quot;Inter Bold&quot;;fill:#0b514d;fill-opacity:1" text-anchor="middle">rules</text><rect width="46" height="38" x="859" y="702" fill="#ddeeec" stroke="#0f7f78" stroke-dasharray="6, 5" stroke-width="2" rx="19"/><text x="882" y="726.4" fill="#0f7f78" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" style="font-style:normal;font-variant:normal;font-weight:700;font-stretch:normal;font-family:Inter;-inkscape-font-specification:&quot;Inter Bold&quot;;fill:#0b514d;fill-opacity:1" text-anchor="middle">ui</text><text x="636" y="768" fill="#0f7f78" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" style="font-style:normal;font-variant:normal;font-weight:500;font-stretch:normal;font-family:Inter;-inkscape-font-specification:&quot;Inter Medium&quot;;fill:#0b605b;fill-opacity:1">Create • reuse • bring your own</text><path stroke="#221f1d" stroke-width="4.5" d="M808 796v22"/><path fill="#221f1d" d="m808 832-9-15h18z"/><rect width="400" height="104" x="608" y="836" fill="#fffdf8" stroke="#221f1d" stroke-width="2" rx="22"/><text x="636" y="882" fill="#221f1d" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="800" letter-spacing=".2" style="font-style:normal;font-variant:normal;font-weight:700;font-stretch:normal;font-family:Inter;-inkscape-font-specification:&quot;Inter Bold&quot;">STORIES → BUILD</text><text x="636" y="910" fill="#6f6660" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="500" style="font-style:normal;font-variant:normal;font-weight:500;font-stretch:normal;font-family:Inter;-inkscape-font-specification:&quot;Inter Medium&quot;;fill:#4c4641;fill-opacity:1">Bounded, testable work</text><path fill="none" stroke="#221f1d" stroke-width="4.5" d="M808 940v16q0 16-16 16H566"/><path fill="#221f1d" d="m552 972 14-9v18z"/><rect width="218" height="28" x="570" y="941" fill="#e4e0f9" rx="14"/><text x="679" y="961.5" fill="#40359f" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="800" letter-spacing=".4" text-anchor="middle">AUTO MODE STOPS AFTER BUILD</text><rect width="456" height="190" x="72" y="877" fill="#fdf1ea" stroke="#221f1d" stroke-width="4" rx="26"/><text x="100" y="935" fill="#221f1d" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="800" letter-spacing=".3" style="font-style:normal;font-variant:normal;font-weight:700;font-stretch:normal;font-family:Inter;-inkscape-font-specification:&quot;Inter Bold&quot;"><tspan fill="#d45a2e" style="font-style:normal;font-variant:normal;font-weight:700;font-stretch:normal;font-family:Inter;-inkscape-font-specification:&quot;Inter Bold&quot;;fill:#87381c;fill-opacity:1">USE IT</tspan> → REVIEW</text><text x="100" y="967" fill="#6f6660" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="500" style="font-style:normal;font-variant:normal;font-weight:500;font-stretch:normal;font-family:Inter;-inkscape-font-specification:&quot;Inter Medium&quot;"><tspan style="fill:#4a4440;fill-opacity:1">Feel it • Show it • Gather feedback</tspan></text><rect width="91" height="40" x="100" y="992" fill="#f9decc" rx="20"/><text x="145.5" y="1017.4" fill="#a8431f" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" style="font-style:normal;font-variant:normal;font-weight:700;font-stretch:normal;font-family:Inter;-inkscape-font-specification:&quot;Inter Bold&quot;" text-anchor="middle"><tspan style="font-style:italic;font-variant:normal;font-weight:600;font-stretch:normal;font-family:Inter;-inkscape-font-specification:&quot;Inter Semi-Bold Italic&quot;;fill:#7b3319;fill-opacity:1">Accept</tspan></text><rect width="96" height="40" x="203" y="992" fill="#f9decc" rx="20"/><text x="251" y="1017.4" fill="#a8431f" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" style="font-style:normal;font-variant:normal;font-weight:700;font-stretch:normal;font-family:Inter;-inkscape-font-specification:&quot;Inter Bold&quot;" text-anchor="middle"><tspan style="font-style:italic;font-variant:normal;font-weight:600;font-stretch:normal;font-family:Inter;-inkscape-font-specification:&quot;Inter Semi-Bold Italic&quot;;fill:#7b3319;fill-opacity:1">Change</tspan></text><rect width="85" height="40" x="311" y="992" fill="#f9decc" rx="20"/><text x="353.5" y="1017.4" fill="#a8431f" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" style="font-style:normal;font-variant:normal;font-weight:700;font-stretch:normal;font-family:Inter;-inkscape-font-specification:&quot;Inter Bold&quot;" text-anchor="middle"><tspan style="font-style:italic;font-variant:normal;font-weight:600;font-stretch:normal;font-family:Inter;-inkscape-font-specification:&quot;Inter Semi-Bold Italic&quot;;fill:#7b3319;fill-opacity:1">Reject</tspan></text><path fill="#156f45" d="m180 610 58 80h-31v167q0 12-12 12h-30q-12 0-12-12V690h-31z"/><text x="234" y="745" fill="#156f45" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="23" font-weight="800" letter-spacing=".2" style="font-style:normal;font-variant:normal;font-weight:700;font-stretch:normal;font-family:Inter;-inkscape-font-specification:&quot;Inter Bold&quot;"><tspan x="234" y="745">LEARNING UPDATES</tspan><tspan x="234" y="775">THE BACKLOG</tspan></text><g transform="translate(0 20)"><rect width="456" height="44" x="72" y="1080" fill="#f4f2fd" stroke="#40359f" stroke-width="1.5" rx="15"/><text x="92" y="1098" fill="#40359f" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="800" letter-spacing=".25">AUTO MODE — OPTIONAL</text><text x="92" y="1116" fill="#4c4641" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="600">After approval → runs needed skills → build • pauses for decisions</text><rect width="400" height="44" x="608" y="1080" fill="#f4f2fd" stroke="#40359f" stroke-width="1.5" rx="15"/><text x="628" y="1107" fill="#40359f" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="800" letter-spacing=".25">POST-HOOKS</text><text x="724" y="1107" fill="#4c4641" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="600">Specialist checks • project automation</text></g><g transform="translate(0 40)"><rect width="936" height="166" x="72" y="1140" fill="#23201e" rx="28"/><text x="104" y="1188" fill="#faf5ee" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="800" letter-spacing=".4" style="font-style:normal;font-variant:normal;font-weight:700;font-stretch:normal;font-family:Inter;-inkscape-font-specification:&quot;Inter Bold&quot;"><tspan x="104" y="1188">OWNER MODE:</tspan><tspan x="104" y="1218">PARALLEL PHASE TRACKS</tspan></text><text x="104" y="1254" fill="#b5aba1" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="500" style="font-style:normal;font-variant:normal;font-weight:500;font-stretch:normal;font-family:Inter;-inkscape-font-specification:&quot;Inter Medium&quot;">Shared backlog • Independent phase tracks</text><text x="104" y="1278" fill="#b5aba1" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="500" style="font-style:normal;font-variant:normal;font-weight:500;font-stretch:normal;font-family:Inter;-inkscape-font-specification:&quot;Inter Medium&quot;">Routing only • Use branches/worktrees for isolation</text><path stroke="#e8dfd4" stroke-width="3" d="M620 1226h158"/><path fill="none" stroke="#b0a8f7" stroke-width="3" d="M656 1226c24 0 